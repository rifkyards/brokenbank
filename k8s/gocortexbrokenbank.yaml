#
# GoCortex Broken Bank - Kubernetes Deployment Manifest
# 
# INTENTIONALLY VULNERABLE: This manifest contains hardcoded secrets and
# hostPort bindings by design for security training purposes. Do not
# "harden" these values as they mirror the vulnerable application profile.
#
# Usage:
#   kubectl apply -f k8s/brokenbank.yaml
#   kubectl get pods -n brokenbank
#   kubectl logs -f deployment/brokenbank -n brokenbank

apiVersion: v1
kind: Namespace
metadata:
  name: brokenbank
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokenbank
  namespace: brokenbank
  labels:
    app: brokenbank
spec:
  replicas: 1
  # hostPort cuma bisa dipakai 1 pod per node, jadi pod lama harus dimatikan
  # dulu sebelum pod baru dibuat. RollingUpdate (default) akan macet di Pending.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: brokenbank
  template:
    metadata:
      labels:
        app: brokenbank
    spec:
      containers:
        - name: brokenbank
          image: "DOCKER_IMAGE"
          imagePullPolicy: Always
          ports:
            # Flask app
            - name: flask
              containerPort: 8888
              hostPort: 8888
              protocol: TCP

            # Tomcat app (internal 8080, external 9999)
            - name: tomcat
              containerPort: 8080
              hostPort: 9999
              protocol: TCP

            # React/Next.js SpaceATM Terminal (CVE-2025-55182)
            - name: spaceatm
              containerPort: 7777
              hostPort: 7777
              protocol: TCP

            # OTel Prometheus scrape endpoint (poll-based metrics)
            - name: metrics
              containerPort: 9464
              hostPort: 9464
              protocol: TCP

            # sshd - leaked deployment key / weak root password login
            - name: ssh
              containerPort: 22
              hostPort: 2222
              protocol: TCP

            # Live Transaction Ticker (WebSocket)
            - name: ticker
              containerPort: 6666
              hostPort: 6666
              protocol: TCP

            # PHP eStatements portal (Apache mod_php)
            - name: estatements
              containerPort: 8085
              hostPort: 8085
              protocol: TCP
          env:
            - name: SESSION_SECRET
              value: "hardcoded-docker-secret-key"
            - name: DATABASE_URL
              value: "sqlite:///app/instance/brokenbank.db"
            - name: FLASK_ENV
              value: "production"
            - name: LOCALE
              value: "en"  # Supported: en (English/Australian), kr (Korean)
