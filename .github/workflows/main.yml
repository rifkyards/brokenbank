#
# Code Scan, Build, Push to Amazon ECR, and Deploy to EKS
# Triggers on push to main or manual dispatch
# Image tags: short commit SHA, plus latest
# Requires secrets: CORTEX_API_KEY, CORTEX_API_KEY_ID, CORTEX_API_URL,
#                   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

name: Build, Push and Deploy BrokenBank
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-3
  EKS_CLUSTER_NAME: rifky-cluster
  ECR_REPOSITORY: rifkyards/brokenbank
  CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
  CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
  CORTEX_API_URL: ${{ secrets.CORTEX_API_URL }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set image tag, repo and branch
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME}"

          echo "IMAGE_TAG=$IMAGE_TAG"          >> "$GITHUB_ENV"
          echo "BRANCH=$BRANCH"                >> "$GITHUB_ENV"
          echo "REPO_ID=$GITHUB_REPOSITORY"    >> "$GITHUB_ENV"

          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $BRANCH"
          echo "Image tag  : $IMAGE_TAG"

      - name: Download cortexcli
        run: |
          RESPONSE=$(curl -s --location \
            "$CORTEX_API_URL/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
            -H "Authorization: $CORTEX_API_KEY" \
            -H "x-xdr-auth-id: $CORTEX_API_KEY_ID")

          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.signed_url')

          curl -fL -o cortexcli "$DOWNLOAD_URL"
          chmod +x cortexcli
          ./cortexcli --version

      - name: Run Cortex CLI Code Scan
        run: |
          ./cortexcli \
            --api-base-url "$CORTEX_API_URL" \
            --api-key "$CORTEX_API_KEY" \
            --api-key-id "$CORTEX_API_KEY_ID" \
            code scan \
            --directory "$GITHUB_WORKSPACE" \
            --repo-id "$REPO_ID" \
            --branch "$BRANCH" \
            --source "GITHUB_ACTIONS" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --create-repo-if-missing

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: echo "ECR_REGISTRY=${{ steps.ecr.outputs.registry }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # - name: Save Docker image to tar
      #   run: |
      #     docker save -o image.tar "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # - name: Run Cortex CLI Image Scan
      #   run: |
      #     ./cortexcli \
      #       --api-base-url "$CORTEX_API_URL" \
      #       --api-key "$CORTEX_API_KEY" \
      #       --api-key-id "$CORTEX_API_KEY_ID" \
      #       image scan \
      #       --timeout 600 \
      #       --archive image.tar

      - name: Push image to ECR
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

          sed -i \
            "s|DOCKER_IMAGE|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" \
            k8s/gocortexbrokenbank.yaml

          kubectl apply \
            -f k8s/gocortexbrokenbank.yaml
